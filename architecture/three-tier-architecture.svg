<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#334155"/></marker>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3b68"/><stop offset="1" stop-color="#1676a8"/></linearGradient>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#e6f4ff}
    .h{font:700 21px Arial,sans-serif;fill:#0f172a}.t{font:16px Arial,sans-serif;fill:#334155}
    .small{font:14px Arial,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .box{stroke-width:2;rx:16}.pill{font:700 14px Arial,sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1200" height="820" fill="#f8fafc"/>
<rect x="0" y="0" width="1200" height="112" fill="url(#header)"/>
<text x="54" y="52" class="title">AWS Three-Tier Web Application</text>
<text x="56" y="83" class="sub">Reference architecture • network isolation • least-privilege traffic flow</text>

<rect x="430" y="145" width="340" height="72" class="box" fill="#e0f2fe" stroke="#0284c7"/>
<text x="600" y="174" text-anchor="middle" class="h">Internet / Users</text>
<text x="600" y="198" text-anchor="middle" class="t">HTTPS request</text>

<path d="M600 217 V257" class="line"/>
<rect x="350" y="260" width="500" height="95" class="box" fill="#dbeafe" stroke="#2563eb"/>
<text x="600" y="294" text-anchor="middle" class="h">Application Load Balancer (ALB)</text>
<text x="600" y="321" text-anchor="middle" class="t">Listener :443 / optional :80 redirect</text>
<text x="600" y="342" text-anchor="middle" class="small">Public subnets across multiple AZs (recommended)</text>

<path d="M600 355 V398" class="line"/>
<rect x="100" y="402" width="1000" height="190" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
<text x="128" y="434" class="h">Application tier • Private subnet(s)</text>
<rect x="150" y="455" width="400" height="100" class="box" fill="#dcfce7" stroke="#16a34a"/>
<text x="350" y="488" text-anchor="middle" class="h">EC2 Application Server</text>
<text x="350" y="515" text-anchor="middle" class="t">WordPress / web application</text>
<text x="350" y="539" text-anchor="middle" class="small">Inbound only from ALB security group</text>
<rect x="650" y="455" width="400" height="100" class="box" fill="#fef3c7" stroke="#d97706"/>
<text x="850" y="488" text-anchor="middle" class="h">Target Group</text>
<text x="850" y="515" text-anchor="middle" class="t">Registered application targets</text>
<text x="850" y="539" text-anchor="middle" class="small">Health check: application endpoint</text>
<path d="M850 402 V386 H600 V355" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M650 505 H550" class="line"/>

<path d="M350 592 V634" class="line"/>
<rect x="250" y="638" width="700" height="105" class="box" fill="#f3e8ff" stroke="#9333ea"/>
<text x="600" y="672" text-anchor="middle" class="h">Database tier • Private subnet</text>
<text x="600" y="700" text-anchor="middle" class="t">MySQL database • TCP 3306 from app security group only</text>
<text x="600" y="725" text-anchor="middle" class="small">No direct public database access</text>

<text x="48" y="785" class="small">Security groups: ALB → application port; application → database port. Adjust to your verified deployment.</text>
</svg>